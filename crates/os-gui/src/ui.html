<style>
:root{
  --bg:#f3f6fa; --ink:#13263d; --muted:#6d7f96; --line:#e2e9f2; --card:#fff;
  --accent:#e8743c; --accent-soft:#fdf0e9; --blue:#2e6b8a; --blue-soft:#eaf3f8;
  --nav:#0d2035; --nav2:#163454; --ok:#1d8a63; --warn:#c9741b;
  --shadow:0 8px 28px rgba(18,45,78,.07); --radius:14px;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{font:14px/1.6 "Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;color:var(--ink);background:var(--bg);overflow:hidden}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
.app{display:flex;height:100vh}

/* ---------- sidebar ---------- */
.sidebar{width:274px;flex:0 0 274px;background:linear-gradient(160deg,var(--nav) 0%,var(--nav2) 100%);color:#dce7f2;display:flex;flex-direction:column;box-shadow:4px 0 20px rgba(8,24,42,.16);z-index:2}
.brand{padding:20px 14px 14px;border-bottom:1px solid rgba(255,255,255,.08);text-align:center}
.brand .brand-logo{width:170px;max-width:100%;display:block;margin:0 auto 2px;filter:drop-shadow(0 4px 16px rgba(8,24,42,.5))}
.brand p{margin:4px 0 0;font-size:11.5px;color:#8fa8c0;letter-spacing:.3px}
.searchbox{margin:16px 16px 6px;position:relative}
.searchbox input{width:100%;padding:9px 12px 9px 32px;border-radius:9px;border:1px solid rgba(255,255,255,.13);background:rgba(255,255,255,.07);color:#fff;outline:none;font-size:12.5px}
.searchbox input::placeholder{color:#8ba4bd}
.searchbox input:focus{border-color:var(--accent);background:rgba(255,255,255,.12)}
.searchbox span{position:absolute;left:11px;top:8px;color:#8ba4bd;font-size:13px}
.nav{flex:1;overflow-y:auto;padding:8px 10px 20px}
.nav::-webkit-scrollbar{width:6px}.nav::-webkit-scrollbar-thumb{background:rgba(255,255,255,.14);border-radius:6px}
.group{margin-top:14px}
.group-title{display:flex;align-items:center;justify-content:space-between;padding:6px 12px;font-size:11px;letter-spacing:1.1px;text-transform:uppercase;color:#7f9ab5;font-weight:700;cursor:pointer;user-select:none}
.group-title .cnt{font-size:10px;background:rgba(255,255,255,.09);padding:1px 7px;border-radius:20px;letter-spacing:0}
.group-title:hover{color:#cfe0ef}
.nav-item{display:block;width:100%;text-align:left;padding:8px 12px 8px 14px;margin:2px 0;border:0;border-left:3px solid transparent;border-radius:0 8px 8px 0;background:transparent;color:#c3d4e4;font-size:12.7px;line-height:1.35;transition:.16s}
.nav-item small{display:block;color:#7e9ab4;font-size:10.5px;margin-top:1px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav-item:hover{background:rgba(255,255,255,.07);color:#fff}
.nav-item.active{background:rgba(232,116,60,.15);border-left-color:var(--accent);color:#fff;font-weight:600}
.nav-item.active small{color:#e9bda5}
.side-foot{padding:12px 20px;border-top:1px solid rgba(255,255,255,.08);font-size:10.5px;color:#7f9ab5;display:flex;justify-content:space-between}
.dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:#3ddc97;margin-right:5px;box-shadow:0 0 8px #3ddc97}

/* ---------- main ---------- */
.main{flex:1;display:flex;flex-direction:column;min-width:0}
.topbar{height:64px;flex:0 0 64px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 30px;box-shadow:0 2px 10px rgba(18,45,78,.03);z-index:1}
.crumb{font-size:13px;color:var(--muted);display:flex;align-items:center;gap:8px;min-width:0}
.crumb b{color:var(--ink);font-weight:600;font-size:14px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crumb .sep{color:#c2ceda}
.actions{display:flex;align-items:center;gap:12px;flex-shrink:0}
.seg{display:flex;background:#eef2f7;border-radius:9px;padding:3px}
.seg button{border:0;background:transparent;padding:6px 13px;border-radius:7px;font-size:12px;color:var(--muted);font-weight:600;transition:.15s}
.seg button.on{background:#fff;color:var(--blue);box-shadow:0 2px 7px rgba(18,45,78,.12)}
.badge{font-size:11px;background:var(--blue-soft);color:var(--blue);padding:5px 10px;border-radius:20px;font-weight:600}
.ghost{border:1px solid var(--line);background:#fff;padding:6px 12px;border-radius:8px;font-size:12px;color:var(--muted)}
.ghost:hover{border-color:var(--accent);color:var(--accent)}
.content{flex:1;overflow-y:auto;padding:26px 32px 60px;scroll-behavior:smooth}
.content::-webkit-scrollbar{width:9px}.content::-webkit-scrollbar-thumb{background:#cdd9e6;border-radius:9px}
.wrap{max-width:1180px;margin:0 auto;animation:fade .32s ease}
@keyframes fade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes fadeRow{from{opacity:0}to{opacity:1}}

.hero{background:linear-gradient(115deg,#fff 0%,#fbfdff 60%,#f2f8fc 100%);border:1px solid var(--line);border-radius:var(--radius);padding:24px 28px;box-shadow:var(--shadow);position:relative;overflow:hidden}
.hero:after{content:"";position:absolute;right:-60px;top:-70px;width:230px;height:230px;border-radius:50%;background:radial-gradient(circle,rgba(232,116,60,.10),transparent 70%)}
.hero .tag{display:inline-block;font-size:10.5px;letter-spacing:.7px;text-transform:uppercase;font-weight:700;color:var(--accent);background:var(--accent-soft);padding:4px 10px;border-radius:20px;margin-bottom:10px}
.hero h2{margin:0;font-size:24px;font-weight:680;letter-spacing:.2px}
.hero .en{color:var(--blue);font-size:13px;margin:3px 0 10px;font-weight:500}
.hero p{margin:0;color:var(--muted);max-width:820px;font-size:13px}
.method{margin-top:14px;display:inline-flex;gap:8px;align-items:flex-start;background:#f6f9fc;border:1px dashed #cfdde9;padding:8px 12px;border-radius:9px;color:#4a637d;font-size:11.7px;max-width:100%}
.method b{color:var(--blue);white-space:nowrap}

.card{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);box-shadow:var(--shadow);padding:22px 24px;margin-top:18px}
.card h3{margin:0 0 4px;font-size:15px;font-weight:650;display:flex;align-items:center;gap:8px}
.card h3:before{content:"";width:4px;height:15px;border-radius:3px;background:var(--accent)}
.card .sub{color:var(--muted);font-size:11.8px;margin:0 0 18px 12px}

.fields{display:grid;grid-template-columns:repeat(auto-fill,minmax(268px,1fr));gap:14px}
.field{background:#fbfcfe;border:1px solid #e8eef5;border-radius:11px;padding:12px 13px;transition:.16s}
.field:focus-within{border-color:#efb18e;background:#fff;box-shadow:0 0 0 3px rgba(232,116,60,.08)}
.field label{display:block;font-size:12.2px;font-weight:600;margin-bottom:7px;color:#283f59}
.field label small{display:block;font-weight:400;color:#93a4b7;font-size:10.5px;margin-top:1px;min-height:14px}
.row{display:flex;gap:6px}
.row input,.row select{border:1px solid #dce5ee;background:#fff;border-radius:8px;padding:7px 9px;outline:none;min-width:0}
.row input{flex:1;font-variant-numeric:tabular-nums;font-size:13px}
.row input:focus,.row select:focus{border-color:var(--accent)}
.row select{flex:0 0 92px;font-size:11.5px;color:var(--blue);background:#f4f9fc;font-weight:600;cursor:pointer}
.row select.wide{flex:1;font-size:12.5px;color:var(--ink);background:#fff;font-weight:400}

.toolbar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:20px;padding-top:18px;border-top:1px solid var(--line)}
.btn{border:0;border-radius:9px;padding:10px 20px;font-size:13px;font-weight:650;letter-spacing:.2px;transition:.16s}
.btn.primary{background:linear-gradient(100deg,var(--accent),#f08a4f);color:#fff;box-shadow:0 5px 14px rgba(232,116,60,.28)}
.btn.primary:hover{transform:translateY(-1px);box-shadow:0 8px 18px rgba(232,116,60,.35)}
.btn.plain{background:#eef3f8;color:var(--blue)}
.btn.plain:hover{background:#e2ebf3}
.btn:disabled{opacity:.55;cursor:wait;transform:none}

/* ---------- print / PDF ---------- */
#printView{display:none}
@media print{
  @page{size:A4;margin:16mm 14mm}
  html,body{overflow:visible;background:#fff;height:auto}
  .app{display:none!important}
  #printView{display:block;font:12px/1.7 "Segoe UI","Microsoft YaHei","PingFang SC",sans-serif;color:#13263d;-webkit-print-color-adjust:exact;print-color-adjust:exact}
  .pv-head{display:flex;justify-content:space-between;align-items:center;border-bottom:3px solid #2e6b8a;padding-bottom:10px}
  .pv-head img{height:46px}
  .pv-brand{color:#2e6b8a;font-weight:650;font-size:12px;letter-spacing:.5px;text-align:right;line-height:1.5}
  .pv-brand b{color:#e8743c;font-size:14px;letter-spacing:1.5px}
  .pv-title{margin:16px 0 2px;font-size:20px;font-weight:750;color:#13263d}
  .pv-meta{display:flex;flex-wrap:wrap;gap:16px;color:#6d7f96;font-size:10.5px;margin-bottom:6px;padding-bottom:10px;border-bottom:1px solid #e2e9f2}
  .pv-sec{font-size:13px;font-weight:700;color:#2e6b8a;border-left:4px solid #e8743c;padding-left:8px;margin:16px 0 8px;page-break-after:avoid}
  table.pv{width:100%;border-collapse:collapse;margin-bottom:4px}
  table.pv th{background:#eaf3f8;color:#13263d;font-size:10.5px;text-align:left;padding:6px 9px;border:1px solid #d5e2ee;font-weight:650}
  table.pv td{padding:5px 9px;border:1px solid #d5e2ee;font-size:11.5px;vertical-align:top}
  table.pv td.v{font-weight:650;white-space:nowrap}
  table.pv tr:nth-child(even) td{background:#f6f9fc}
  table.pv tr{page-break-inside:avoid}
  .pv-foot{margin-top:20px;border-top:1.5px solid #e8743c;padding-top:7px;display:flex;justify-content:space-between;color:#6d7f96;font-size:9.5px}
}
.status{margin-left:auto;font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:7px}
.status.ok{color:var(--ok)}.status.bad{color:#c0453b}

table{width:100%;border-collapse:separate;border-spacing:0;font-size:12.6px}
th{text-align:left;background:#f6f9fc;color:#4a6079;font-weight:650;font-size:11.5px;letter-spacing:.3px;padding:10px 12px;border-bottom:1px solid var(--line);position:sticky;top:0;z-index:5;box-shadow:0 1px 0 var(--line)}
td{padding:10px 12px;border-bottom:1px solid #eef2f7;vertical-align:top}
tr:last-child td{border-bottom:0}
tbody tr:hover{background:#fbfdff}
td.val{font-variant-numeric:tabular-nums;font-weight:650;color:var(--ink);white-space:nowrap}
td.val.main{color:var(--accent);font-size:13px}
td.val.alt{color:#7690a8;font-weight:500}
td.note{color:#8a9cb0;font-size:11.3px}
td.lab{font-weight:550;color:#2b425e}
table.fctable{table-layout:fixed}
table.fctable td{word-break:break-word;vertical-align:top}
table.fctable td.val{white-space:normal}
.result-wrap{border:1px solid var(--line);border-radius:11px;overflow:hidden;max-height:520px;overflow-y:auto}
tr.fcsec td{background:#eaf1f8;color:#2b425e;font-weight:700;font-size:12.2px;letter-spacing:.4px;border-top:1px solid #d7e3ee;border-bottom:1px solid #d7e3ee}
tr.fcsub td{background:#f7fafd;color:#4a6079;font-weight:650;font-size:11.8px}
.fcalt{font-size:11px;color:#7690a8;font-weight:500;margin-top:3px}
.empty{padding:34px;text-align:center;color:#9aabbb;font-size:12.5px}
.verify{margin-top:12px;padding:12px 16px;border-radius:10px;font-size:12px;display:none}
.verify.show{display:block;animation:fade .3s}
.verify.pass{background:#eaf7f1;color:#146c4d;border:1px solid #bfe8d5}
.verify.fail{background:#fdf0ee;color:#a63c2f;border:1px solid #f4cfc8}

.grid2{display:grid;grid-template-columns:1fr 1fr;gap:16px}
.mini{background:#fbfcfe;border:1px solid #e8eef5;border-radius:11px;padding:16px}
.mini h4{margin:0 0 10px;font-size:13px;color:var(--blue)}
.kv{display:flex;justify-content:space-between;padding:5px 0;border-bottom:1px dashed #e8eef5;font-size:12px}
.kv span{color:var(--muted)}.kv b{font-weight:650;font-variant-numeric:tabular-nums}
.chip{display:inline-block;background:var(--blue-soft);color:var(--blue);border-radius:6px;padding:2px 8px;font-size:11px;margin:2px 4px 2px 0}
.glossary dt{font-weight:650;color:var(--blue);font-size:13px;margin-top:12px}
.glossary dd{margin:2px 0 0;color:#516b85;font-size:12px}
.formline{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.formline input{border:1px solid #dce5ee;border-radius:8px;padding:8px 10px;outline:none;font-size:12.5px}
.formline input:focus{border-color:var(--accent)}
.formline input.w{flex:1;min-width:110px}
.bigsearch{width:100%;padding:14px 16px;border:1px solid #dce5ee;border-radius:11px;font-size:14px;outline:none;box-shadow:var(--shadow)}
.bigsearch:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(232,116,60,.1)}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px;margin-top:16px}
.tile{background:#fff;border:1px solid var(--line);border-radius:11px;padding:14px;text-align:left;transition:.16s;box-shadow:0 3px 12px rgba(18,45,78,.04)}
.tile:hover{transform:translateY(-2px);border-color:#efb18e;box-shadow:var(--shadow)}
.tile b{display:block;font-size:13px;margin-bottom:3px}
.tile small{color:var(--blue);font-size:10.5px;display:block;margin-bottom:6px}
.tile p{margin:0;color:var(--muted);font-size:11.3px;line-height:1.5}
.toast{position:fixed;right:24px;bottom:22px;background:#13263d;color:#fff;padding:11px 18px;border-radius:10px;font-size:12.5px;box-shadow:0 10px 30px rgba(10,25,45,.3);opacity:0;transform:translateY(10px);transition:.25s;pointer-events:none;z-index:9}
.toast.show{opacity:1;transform:none}
.fuel-comp{display:grid;grid-template-columns:repeat(2,1fr);gap:8px 26px;margin:8px 0 2px}
.comp-row{display:flex;align-items:center;gap:8px}
.comp-row label{width:56px;flex:none;font:600 13px Consolas,monospace;color:#2e6b8a}
.comp-row input{flex:1;min-width:0;padding:6px 8px;border:1px solid #cfd8e3;border-radius:6px;font:13px Consolas,monospace}
.comp-row input.locked{background:#eef2f6;color:#8a97a8;cursor:not-allowed}
.comp-note{font-size:11px;color:#8a97a8;width:62px;flex:none;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.comp-sum{grid-column:1/-1;margin-top:6px;font-size:13px;color:#555}
.comp-sum b{color:#2e6b8a}
.fuel-hint{font-size:12px;color:#8a97a8;margin:4px 0 0}
</style>
</head>

<script>
const S = { modules:[], byId:{}, current:null, system:'SI', lang:'zh', form:{}, last:null, db:null, audit:[], collapsed:{} };
const $ = s => document.querySelector(s);
const esc = s => String(s==null?'':s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
// Single-language display. L(en,zh) picks by S.lang; oneLang splits the
// "English · 中文" pairs emitted by the kernel; cjkFree strips CJK glyphs for
// mixed labels that carry no " · " separator.
const L = (en,zh) => S.lang==='zh' ? zh : en;
const sysName = () => S.system==='SI' ? L('SI (Metric)','SI 公制') : L('US (Imperial)','US 英制');
function cjkFree(s){
  let t=String(s==null?'':s).replace(/[\u4e00-\u9fff\u3000-\u303f\uff00-\uffef·]/g,' ');
  t=t.replace(/\s{2,}/g,' ').trim().replace(/^[,;:.\/\- ]+|[,;:.\- ]+$/g,'').trim();
  return t;
}
function oneLang(s,dict){
  const t=String(s==null?'':s).trim(); if(!t) return '';
  const i=t.indexOf(' · ');
  if(i>=0){ const en=t.slice(0,i).trim(), zh=t.slice(i+3).trim();
    return S.lang==='zh' ? (zh||en) : (en||zh); }
  if(S.lang==='en'){ const e=cjkFree(t); return /[A-Za-z0-9]/.test(e) ? e : t; }
  if(/[\u4e00-\u9fff]/.test(t)) return t;
  const zh=(dict||FC_ZH)[t]; return zh||t;
}
// Trim IEEE-754 round-trip tails (20.00000000000853 -> 20) without losing
// meaningful precision. The stored value stays untouched; this is display only.
const nice = v => { const n=Number(v); if(!isFinite(n)||n===0) return '0';
  const a=Math.abs(n); return String(Number(n.toPrecision(a>=1e7||a<1e-4?6:9))); };

async function api(path, body){
  const opt = body === undefined ? {} : {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(body)};
  const r = await fetch(path, opt);
  const j = await r.json();
  if (j.error) throw new Error(j.error);
  return j;
}
function toast(msg){ const t=$('#toast'); t.textContent=msg; t.classList.add('show'); clearTimeout(t._t); t._t=setTimeout(()=>t.classList.remove('show'),2400); }
function setStatus(text, cls=''){ const e=$('#status'); if(e){ e.textContent=text; e.className='status '+cls; } }

async function init(){
  try{
    S.modules = await api('/api/modules');
    S.audit = await api('/api/audit');
    S.db = await api('/api/db');
    S.modules.forEach(m=>S.byId[m.id]=m);
    refreshChrome();
    buildNav('');
    await openModule('fuel_combustion');
  }catch(e){ $('#content').innerHTML = '<div class="wrap"><div class="card"><h3>'+L('Initialization failed','初始化失败')+'</h3><p>'+esc(e.message)+'</p></div></div>'; }
}

// Topbar / sidebar chrome strings that depend on S.lang. Called on init and
// on every language switch.
function refreshChrome(){
  $('#navSearch').placeholder = L('Search modules','搜索模块');
  $('#modCount').textContent = S.modules.length + (S.lang==='zh'?' 个模块':' modules');
  $('#dbBadge').textContent = L('DB connected','数据库已连接') + ' · SQLite v' + (S.db&&S.db.schema_version||'?') + ' · ' + ((S.db&&S.db.tables)||[]).length + (S.lang==='zh'?' 表':' tables') + ((S.db&&S.db.source&&S.db.source.rows)?(' · '+(S.lang==='zh'?'源数据 ':'source rows ')+S.db.source.rows+(S.lang==='zh'?' 行':'')):'');

function buildNav(filter){
  const groups = [
    ['Reference',L('Reference','参考')], ['Applications',L('Applications','应用')],
    ['SystemDesign',L('System Design','系统设计')], ['Tools',L('Tools','工具')]
  ];
  const q = filter.trim().toLowerCase();
  let html='';
  for(const [key,label] of groups){
    const items = S.modules.filter(m=>m.group_key===key && (!q || (m.name+' '+m.en+' '+m.desc+' '+m.method).toLowerCase().includes(q)));
    if(!items.length) continue;
    const col = !!S.collapsed[key];
    html += '<div class="group"><div class="group-title" data-g="'+key+'">'+esc(label)+'<span class="cnt">'+items.length+'</span></div>';
    if(!col) for(const m of items){
      const nm = S.lang==='zh' ? m.name : (m.en||m.name);
      html += '<button class="nav-item'+(S.current&&S.current.id===m.id?' active':'')+'" data-id="'+m.id+'">'+esc(nm)+'</button>';
    }
    html += '</div>';
  }
  if(!html) html='<div class="empty">'+L('No matching modules','没有匹配的模块')+'</div>';
  $('#nav').innerHTML=html;
}

$('#nav').addEventListener('click', e=>{
  const g=e.target.closest('.group-title');
  if(g){ S.collapsed[g.dataset.g]=!S.collapsed[g.dataset.g]; buildNav($('#navSearch').value); return; }
  const b=e.target.closest('.nav-item');
  if(b) openModule(b.dataset.id);
});
$('#navSearch').addEventListener('input', e=>buildNav(e.target.value));

async function openModule(id){
  const m=S.byId[id]; if(!m) return;
  S.current=m; S.last=null; S.form={};
  buildNav($('#navSearch').value);
  const nm = S.lang==='zh' ? m.name : (m.en||m.name);
  $('#crumb').innerHTML='<span>'+esc(m.group)+'</span><span class="sep">/</span><b>'+esc(nm)+'</b>';
  if(m.group_key==='Tools'){ renderTool(m); return; }
  // Defaults are stored in SI display units; convert them to the active system.
  const req = m.fields.map(f=>({qty:f.qty, value:f.default_display, unit:f.unit_si}));
  let vals = req.map(r=>r.value), units = req.map(()=>null);
  if(S.system==='US'){
    try{ const r=await api('/api/convert-fields',{fields:req,to_system:'US'}); vals=r.values; units=r.units; }catch(e){ console.warn(e); }
  }
  m.fields.forEach((f,i)=>{ S.form[f.key]={value:vals[i], unit:units[i]||(S.system==='US'?f.unit_us:f.unit_si)}; });
  renderModule(m);
}

function applyFuel(code){
  const gf=(S.db.gas_fuels||[]).find(g=>g.code===code);
  const custom=!gf;
  COMP.forEach(c=>{
    const el=document.getElementById('cmp_'+c.key);
    if(gf){ const key=c.sym.toLowerCase(); const v=(gf[key]!=null)?gf[key]:0; el.value=v; S.fuelComp[c.key]=v; el.disabled=true; el.classList.add('locked'); }
    else { el.disabled=false; el.classList.remove('locked'); }
  });
  const h=document.querySelector('.fuel-hint'); if(h) h.remove();
  const note=document.createElement('div'); note.className='fuel-hint';
  if(custom){
    note.textContent=L('Custom mode: edit volume fractions (%) freely; they are normalised on compute.','自定义模式：可直接编辑各组分体积分数（%），总和不必等于 100，计算时自动归一化。');
  } else {
    // 与源程序一致：预设燃料显示数据库参考值（STP 直读），单位随当前系统
    const ref=[];
    const us=S.system==='US';
    if(gf.gravity!=null) ref.push('SG='+(+gf.gravity).toFixed(2));
    if(us){
      if(gf.gross_heat_btu_scf!=null) ref.push('Gross='+Math.round(gf.gross_heat_btu_scf)+' Btu/scf');
      if(gf.net_heat_btu_scf!=null) ref.push('Net='+Math.round(gf.net_heat_btu_scf)+' Btu/scf');
    } else {
      if(gf.gross_heat_si!=null) ref.push('Gross='+(+gf.gross_heat_si).toFixed(2)+' MJ/Nm³');
      if(gf.net_heat_si!=null) ref.push('Net='+(+gf.net_heat_si).toFixed(2)+' MJ/Nm³');
    }
    note.innerHTML=L('Preset "'+esc(gf?gf.name:'')+'" loaded (read-only, same as source).',
        '已载入预设「'+esc(gf?gf.name:'')+'」组分（只读，与源程序一致）。')
      +(ref.length?'<br><b>'+(S.lang==='zh'?'源库参考值（STP）：':'Source reference (STP): ')+'</b>'+esc(ref.join(' · ')):'');
  }
  document.querySelector('.fuel-comp').after(note);
  updateCompSum();
}

function updateCompSum(){
  let s=0; COMP.forEach(c=>{ s+=(parseFloat(document.getElementById('cmp_'+c.key).value)||0); });
  const el=document.getElementById('compSum'); if(el) el.textContent=s.toFixed(2);
}

async function runFuelCompute(){
  const btn=document.getElementById('runBtn'); btn.disabled=true; setStatus(L('Computing…','计算中…'));
  try{
    const inputs={};
    COMP.forEach(c=>{ const v=parseFloat(document.getElementById('cmp_'+c.key).value)||0; S.fuelComp[c.key]=v; inputs[c.key]={value:v,unit:'frac'}; });
    const res=await api('/api/compute',{id:'fuel_data',inputs});
    S.last=res; renderResults(res);
    setStatus(L('✔ Calculated and saved to history','✔ 已计算并保存至 SQLite 计算历史'),'ok');
  }catch(e){ setStatus('✕ '+e.message,'bad'); }
  finally{ btn.disabled=false; }
}

async function verifyFuelUnits(){
  const v=document.getElementById('verify'); v.className='verify show'; v.textContent=L('Computing with both unit systems…','正在用两套单位输入分别计算…');
  try{
    const inputs={};
    COMP.forEach(c=>{ const val=parseFloat(document.getElementById('cmp_'+c.key).value)||0; inputs[c.key]={value:val,unit:'frac'}; });
    const a=await api('/api/compute',{id:'fuel_data',inputs});
    const b=await api('/api/compute',{id:'fuel_data',inputs});
    const n=Math.min(a.rows.length,b.rows.length); let same=0;
    for(let i=0;i<n;i++){ if(a.rows[i].si===b.rows[i].si) same++; }
    const pass=same===n;
    v.className='verify show '+(pass?'pass':'fail');
    v.innerHTML='<b>'+(pass?'✔ PASS':'⚠ '+(S.lang==='zh'?'存在差异':'diffs'))+'</b> — '+same+'/'+n+(S.lang==='zh'?' 项一致（组分单位为 %，SI/US 无换算差异）。':' items match (unit is %, no SI/US difference).');
  }catch(e){ v.className='verify show fail'; v.textContent=(S.lang==='zh'?'自检失败：':'Check failed: ')+e.message; }
}

function bi(s,dict){ return oneLang(s,dict); }

// The kernel prints source (US) values, often with an embedded SI counterpart.
// Split into {us, si} so the table can show whichever system is active.
const FC_SI_UNIT=/(?:kW|°C|MJ\/Nm³|MJ\/kg|kg\/h|Nm³\/h|Am³\/h)/;
function fcNum(x){
  if(!isFinite(x)) return '—';
  return Number(x.toFixed(2)).toLocaleString('en-US',{maximumFractionDigits:2});
}
function fcUnits(t){
  const s=String(t==null?'':t);
  if(!s.trim()) return {us:s,si:s};
  if(s.indexOf('│')>=0){
    const p=s.split('│').map(x=>x.trim());
    if(p.length>=2 && FC_SI_UNIT.test(p[1])) return {us:p[0],si:p[1]};
    return {us:s,si:s};
  }
  const m=s.match(/^\s*(-?[\d.,]+)\s*(.*?)\s*$/);
  if(!m) return {us:s,si:s};
  const v=parseFloat(m[1].replace(/,/g,'')), u=m[2].trim();
  const cv=(k,unit)=>({us:s,si:fcNum(v*k)+' '+unit});
  if(/^BTU\/hr$/i.test(u))            return cv(0.000293071,'kW');
  if(/^Mill\.Btu\/h$/i.test(u))       return cv(293.071,'kW');
  if(/^scfh$/i.test(u))               return cv(0.0283168*273.15/288.706,'Nm³/h');
  if(/^acfh$/i.test(u))               return cv(0.0283168,'Am³/h');
  if(/^lb\/hr$/i.test(u))             return cv(0.45359237,'kg/h');
  if(/^°F$/.test(u))                  return {us:s,si:fcNum((v-32)*5/9)+' °C'};
  if(/^SCF air\/SCF gas$/i.test(u))   return {us:s,si:fcNum(v)+' Nm³ air/Nm³ gas'};
  if(/^lb air\/lb fuel$/i.test(u))    return {us:s,si:fcNum(v)+' kg air/kg fuel'};
  if(/^Btu\/scf$/i.test(u))           return cv(0.0372589,'MJ/m³');
  if(/^Btu\/lb$/i.test(u))            return cv(0.002326,'MJ/kg');
  return {us:s,si:s};
}
// S.form.fuel_input always holds the source US value; only the display is
// converted, so the compute API keeps receiving the exact source basis.
function fcMode(){ return Math.round(Number((S.form.input_unit||{}).value)||0); }
function fcUnit(){ const o=FINPUT[fcMode()]||FINPUT[0]; return S.system==='SI'?o.si:o.us; }
function fcFactor(){ return S.system==='SI'?(FINPUT[fcMode()]||FINPUT[0]).k:1; }
function fcDisp(){ return Number((Number((S.form.fuel_input||{}).value||0)*fcFactor()).toPrecision(7)); }
function fcToUS(x){ return Number(x)/fcFactor(); }
function fcSyncInput(){
  const el=document.getElementById('f_fuel_input'); if(!el) return;
  el.value=nice(fcDisp());
  const u=document.getElementById('u_fuel_input'); if(u){ u.options[0].textContent=fcUnit(); u.options[0].value='-'; u.value='-'; }
  const lb=document.getElementById('fcInputUnitLabel'); if(lb) lb.textContent=fcUnit();
}

  $('#results').innerHTML='<div class="empty">'+L('Click "Calculate" to see results · auto-saved to history','点击「计算」查看结果 · 结果会自动保存到 SQLite 计算历史')+'</div>';

  $('#resetBtn').onclick=()=>openModule(m.id);
  $('#verifyBtn').onclick=verifyUnits;
  $('#fields').addEventListener('input', onFieldChange);
  $('#fields').addEventListener('change', onFieldChange);
}

function injectWobbePickers(){
  const gases=S.db.gas_fuels||[]; if(!gases.length) return;
  const mk=(label,hvKey,sgKey)=>{
    const opts=gases.map(g=>'<option value="'+esc(g.code)+'">'+esc(g.name)+'（sg '+(g.gravity!=null?g.gravity:'?')+'）</option>').join('');
    return '<div class="field"><label>'+label+'<small>从燃料库一键填入 Hv 与 sg（Hv 取体积高位热值）</small></label>'+
      '<div class="row"><select class="wide" data-hv="'+hvKey+'" data-sg="'+sgKey+'"><option value="">— '+L('Pick a fuel','选择燃料')+' —</option>'+opts+'</select></div></div>';
  };
  const gases2=(S.db.gas_fuels||[]);
  $('#fields').insertAdjacentHTML('afterbegin',
    mk(L('Original gas (fuel library)','原燃气（燃料库）'),'hv_o','sg_o')+mk(L('Replacement gas (fuel library)','替代气（燃料库）'),'hv_s','sg_s'));
  $('#fields').addEventListener('change',function wobbeFill(e){
    const sel=e.target; if(!sel||!sel.dataset||!sel.dataset.hv) return;
    const g=gases2.find(x=>x.code===sel.value); if(!g) return;
    const hv=(g.gross_heat_si!=null)?g.gross_heat_si:(g.net_heat_si||0);
    S.form[sel.dataset.hv]={value:hv,unit:'-'};
    S.form[sel.dataset.sg]={value:(g.gravity!=null?g.gravity:1.0),unit:'-'};
    const a=document.getElementById('f_'+sel.dataset.hv), b=document.getElementById('f_'+sel.dataset.sg);
    if(a) a.value=hv; if(b) b.value=g.gravity;
  });
}

function renderFields(){
  const m=S.current; if(!m) return;
  $('#fields').innerHTML = m.fields.map(f=>{    const st=S.form[f.key]||{value:f.default_display,unit:f.unit_si};
    let control;
    if(f.options && f.options.length){
      control='<div class="row"><select class="wide" id="f_'+f.key+'">'+f.options.map((o,i)=>'<option value="'+i+'"'+(Math.round(Number(st.value))===i?' selected':'')+'>'+esc(o)+'</option>').join('')+'</select></div>';
    }else{
      // Only the active unit system's canonical unit is offered.
      const u = st.unit || (S.system==='SI'?f.unit_si:f.unit_us) || f.unit_si || '-';
      control='<div class="row"><input type="number" step="any" id="f_'+f.key+'" value="'+esc(nice(st.value))+'">'+
        '<select id="u_'+f.key+'"><option value="'+esc(u)+'" selected>'+esc(u)+'</option></select></div>';
    }
    return '<div class="field"><label>'+esc(bi(f.label))+'<small>'+esc(biNote(f.hint||''))+'</small></label>'+control+'</div>';
  }).join('');
}

function onFieldChange(e){
  const id=e.target.id; if(!id) return;
  if(id.startsWith('f_')){ const k=id.slice(2), f=S.current.fields.find(x=>x.key===k);
    let v=Number(e.target.value);
    // Fuel Combustion: the field shows SI units while the kernel expects the
    // source US basis — convert back once so both systems give identical results.
    if(S.current && S.current.id==='fuel_combustion' && k==='fuel_input' && isFinite(v)) v=fcToUS(v);
    S.form[k]=S.form[k]||{}; S.form[k].value=(f&&f.options&&f.options.length)? Number(e.target.value): v; }
  if(id.startsWith('u_')){ const k=id.slice(2); S.form[k]=S.form[k]||{}; S.form[k].unit=e.target.value; }
}

function collectInputs(){
  const o={};
  for(const f of S.current.fields){
    const st=S.form[f.key]||{value:f.default_display,unit:f.unit_si};
    o[f.key]={value:Number(st.value), unit:(f.options&&f.options.length)?'-':st.unit};
  }
  return o;
}

function fcValText(t){
  const s=String(t==null?'':t);
  if(s==='N/A') return L('N/A','不适用');
  if(s==='Off') return L('Off','关');
  if(/^On\b/.test(s)) return L(s,'开');
  if(/Wet %/.test(s)&&/Dry %/.test(s)) return L(s, s.replace('Wet %','湿基 %').replace('Dry %','干基 %'));
  return s;
}
function renderCombustionResults(res){
  if(!res.rows || !res.rows.length){ $('#results').innerHTML='<div class="empty">'+L('No results','无结果')+'</div>'; return; }
  let html='<div class="result-wrap"><table class="fctable"><thead><tr>'+
    '<th style="width:34%">'+L('Item','项目')+'</th>'+
    '<th style="width:26%">'+L('Value (','数值（')+sysName()+L(')','）')+'</th>'+
    '<th>'+L('Note','说明')+'</th></tr></thead><tbody>';
  res.rows.forEach((r,i)=>{
    const isSec = !r.si && /Page [12]/.test(r.note||'');
    const isSub = /Combustion Product Content|Available Heat ·|Flow Rates ·|Temperatures & Heat ·|Main Mass Flows ·|Fuel Composition|Fuel Data ·|Combustion Conditions ·/.test(r.label);
    const label=bi(r.label);
    if(isSec){ html+='<tr class="fcsec"><td colspan="3">'+esc(label)+'</td></tr>'; return; }
    if(isSub){ html+='<tr class="fcsub"><td colspan="3">'+esc(label)+'</td></tr>'; return; }
    const p=fcUnits(r.si);
    const main=fcValText(S.system==='SI'?p.si:p.us);
    html+='<tr style="animation:fadeRow .3s ease '+(Math.min(i,24)*14)+'ms both"><td class="lab">'+esc(label)+'</td>'+
      '<td class="val main">'+esc(main)+'</td>'+

function renderResults(res){
  if(!res.rows || !res.rows.length){ $('#results').innerHTML='<div class="empty">'+L('No results','无结果')+'</div>'; return; }
  const siFirst = S.system==='SI';
  const rows=res.rows.map((r,i)=>{

  }).join('');

async function runCompute(){
  const btn=$('#runBtn'); btn.disabled=true; setStatus(L('Computing…','计算中…'));
  try{
    const res=await api('/api/compute',{id:S.current.id, inputs:collectInputs()});
    S.last=res; renderResults(res);
    setStatus(L('✔ Calculated and saved to history','✔ 已计算并保存至 SQLite 计算历史'),'ok');
  }catch(e){ setStatus('✕ '+e.message,'bad'); }
  finally{ btn.disabled=false; }
}

async function verifyUnits(){
  const v=$('#verify'); v.className='verify show'; v.textContent=L('Computing with both unit systems…','正在用两套单位输入分别计算…');
  try{
    const inputs=collectInputs();
    const a=await api('/api/compute',{id:S.current.id,inputs});
    const other=S.system==='SI'?'US':'SI';
    const req=S.current.fields.map(f=>({qty:f.qty,value:Number(S.form[f.key].value),unit:(f.options&&f.options.length)?'-':S.form[f.key].unit}));
    const cv=await api('/api/convert-fields',{fields:req,to_system:other});
    const inputs2={};
    S.current.fields.forEach((f,i)=>{ inputs2[f.key]={value:(f.options&&f.options.length)?req[i].value:cv.values[i],unit:(f.options&&f.options.length)?'-':cv.units[i]}; });
    const b=await api('/api/compute',{id:S.current.id,inputs:inputs2});
    const n=Math.min(a.rows.length,b.rows.length);
    let same=0; const diffs=[];
    for(let i=0;i<n;i++){ if(a.rows[i].si===b.rows[i].si) same++; else diffs.push(a.rows[i].label+': '+a.rows[i].si+' vs '+b.rows[i].si); }
    const pass=same===n;
    v.className='verify show '+(pass?'pass':'fail');
    v.innerHTML='<b>'+(pass?'✔ PASS':'⚠ '+(S.lang==='zh'?'存在差异':'diffs found'))+'</b> — '+same+'/'+n+
      (S.lang==='zh'?(' 项在 '+S.system+' 与 '+other+' 两套输入下结果完全一致。'):(' items match between '+S.system+' and '+other+' inputs.'))+
      (diffs.length?'<br><small>'+esc(diffs.slice(0,4).join(' ｜ '))+'</small>':'<br><small>'+(S.lang==='zh'?'单位只在输入边界换算一次，内部全程 SI，因此输出不随显示单位制改变。':'Units are converted once at the input boundary; internals stay SI, so output never changes with the display system.')+'</small>');
  }catch(e){ v.className='verify show fail'; v.textContent=(S.lang==='zh'?'自检失败：':'Check failed: ')+e.message; }
}

$('#sysSeg').addEventListener('click', async e=>{
  const b=e.target.closest('button'); if(!b) return;
  const sys=b.dataset.sys; if(sys===S.system) return;
  const old=S.system;
  if(S.current && S.current.group_key!=='Tools' && Object.keys(S.form).length){
    const req=S.current.fields.map(f=>({qty:f.qty,value:Number(S.form[f.key].value),unit:(f.options&&f.options.length)?'-':S.form[f.key].unit}));
    try{
      const r=await api('/api/convert-fields',{fields:req,to_system:sys});
      S.current.fields.forEach((f,i)=>{ S.form[f.key].value=(f.options&&f.options.length)?req[i].value:r.values[i]; S.form[f.key].unit=(f.options&&f.options.length)?S.form[f.key].unit:r.units[i]; });
    }catch(err){ toast(L('Unit conversion failed: ','单位换算失败：')+err.message); return; }
  }
  S.system=sys;
  document.querySelectorAll('#sysSeg button').forEach(x=>x.classList.toggle('on',x.dataset.sys===sys));
  if(S.current){ if(S.current.group_key==='Tools') renderTool(S.current); else if(S.current.id==='fuel_data') renderFuelData(S.current); else if(S.current.id==='gas_liquid_props') renderPrpts(S.current); else if(S.current.id==='fuel_combustion') renderCombustion(S.current); else { renderFields(); if(S.last) renderResults(S.last); } }
  toast(L('Switched to ','已切换到 ')+sysName()+L(', physical values unchanged','，输入物理量保持不变'));
});
